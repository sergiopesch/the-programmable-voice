<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="The Programmable Voice — a history of sound, computation, and the voice systems still to come." />
    <noscript><meta http-equiv="refresh" content="0; url=/manuscript.html" /></noscript>
    <script>
      try {
        const saved = localStorage.getItem('pv:theme')
        const theme = saved === 'dark' || saved === 'light'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff')
      } catch {}
    </script>
    <title>The Programmable Voice</title>
  </head>
  <body>
    <a class="skip-link" href="#reader">Skip to the book</a>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 46rem; margin: 4rem auto; padding: 1rem; font-family: Georgia, serif; line-height: 1.6">
        <h1>The Programmable Voice</h1>
        <p>How humanity taught machines to hear, speak and converse.</p>
        <p><a href="/manuscript.html">Read the complete static manuscript and evidence register.</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
